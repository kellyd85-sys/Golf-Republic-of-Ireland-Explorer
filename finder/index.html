<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Finder – Golf Ireland Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14251c; --muted:#5b6b62; --line:#d9e1db; --bg:#f5f3ec; --panel:#ffffff;
    --green:#1f5d3c; --green-2:#2f7d52; --sand:#e9dfc6; --sea:#dce9ee; --land:#eef0e6;
    --gold:#c9932e; --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
  .app{display:grid;grid-template-columns:420px 1fr;height:100vh}
  @media (max-width:860px){.app{grid-template-columns:1fr;height:auto}.mapwrap{height:70vh}}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  header{padding:22px 26px 14px;border-bottom:1px solid var(--line)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .banner{margin-top:10px;background:#fff6e0;border:1px solid #f0dca8;color:#6b4e12;font-size:12px;padding:6px 10px;border-radius:8px}
  .progress{display:flex;gap:6px;margin-top:14px}
  .progress span{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .progress span.done{background:var(--green-2)} .progress span.now{background:var(--gold)}
  .body{padding:22px 26px;overflow:auto;flex:1}
  .step-k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px;margin:4px 0 6px}
  .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
  label.f{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
  select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  input[type=range]{width:100%;accent-color:var(--green)}
  .rangeval{font-family:Fraunces,serif;font-size:20px;color:var(--green)}
  .opts{display:grid;gap:8px}
  .opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%}
  .opt:hover{border-color:#a9bdb0}
  .opt.sel{border-color:var(--green);background:#eef6f0;box-shadow:inset 0 0 0 1px var(--green)}
  .opt small{display:block;color:var(--muted);font-size:12px}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #b8c6bd;flex:none}
  .opt.sel .dot{border-color:var(--green);background:radial-gradient(var(--green) 45%,transparent 50%)}
  footer{padding:14px 26px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  button.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.primary{background:var(--green);color:#fff;border-color:var(--green)}
  button.primary:hover{background:#184c31}
  button.link{border:none;background:none;color:var(--muted);text-decoration:underline;padding:10px 6px}
  .grow{flex:1}
  .card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;cursor:pointer;background:#fff}
  .card.best{border-color:var(--green);box-shadow:0 2px 0 var(--green)}
  .card.active{outline:2px solid var(--gold)}
  .card .top{display:flex;align-items:baseline;gap:10px}
  .badge{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .card:not(.best) .badge{background:#7a8e82}
  .card h3{margin:0;font-size:16px;flex:1}
  .score{font-family:Fraunces,serif;font-size:22px;color:var(--green)}
  .score small{font-size:12px;color:var(--muted);font-family:Inter}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
  .tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .why{font-size:13px;color:var(--muted);margin:6px 0 0}
  details{margin-top:8px;font-size:12px;color:var(--muted)}
  details table{width:100%;border-collapse:collapse;margin-top:6px}
  details td{padding:3px 0;border-bottom:1px dashed var(--line)} details td:last-child{text-align:right}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--green))}
  .summary{font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .empty{padding:16px;border:1px dashed #c9b98f;border-radius:10px;background:#fffaf0;font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 2px}
  .stats div{background:var(--bg);border-radius:8px;padding:7px 8px;line-height:1.2}
  .stats b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
  .stats span{font-size:11px;color:var(--muted)}
  details table td:first-child{padding-right:10px}
  .cmp-h{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:18px;margin:18px 0 8px}
  .cmp{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cmp th,.cmp td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
  .cmp td:first-child{text-align:left;color:var(--muted)}
  .cmp tr:last-child td{border-bottom:none}
  .badge.sm{width:20px;height:20px;font-size:11px;margin:0 auto}
  .live{margin-top:12px;font-size:13px;color:var(--muted);background:#eef6f0;border-radius:8px;padding:7px 10px}
  .live b{color:var(--green);font-size:16px;font-family:Fraunces,Georgia,serif}
  .live.zero{background:#fff6e0} .live.zero b{color:#a5521b}
  nav.mini{font-size:12px;margin-bottom:10px} nav.mini a{color:var(--green);text-decoration:none} nav.mini a:hover{text-decoration:underline}
  .mapwrap{position:relative;background:var(--sea);min-height:0}
  svg{width:100%;height:100%;display:block}
  .legend{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px}
  .legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
  .lg{width:11px;height:11px;border-radius:50%;display:inline-block}
  .maplabel{position:absolute;right:16px;top:14px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px}
  .tip{position:absolute;pointer-events:none;background:#14251c;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;transform:translate(-50%,-130%);white-space:nowrap;display:none}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <nav class="mini"><a href="../index.html">Home</a> · <a href="../explore/index.html">Explore map</a> · <a href="../method.html">Methodology</a></nav>
      <h1>Find your course</h1>
      <p class="sub">Answer a few questions. Skip any you don't care about.</p>
      <div class="banner">316 courses · 338 starting towns. Public transport times are estimates.</div>
      <div class="progress" id="progress"></div>
      <div class="live" id="live"></div>
    </header>
    <div class="body" id="body"></div>
    <footer id="footer"></footer>
  </aside>
  <div class="mapwrap" id="mapwrap">
    <svg id="map" viewBox="0 0 600 720" preserveAspectRatio="xMidYMid meet" aria-label="Map of Ireland showing golf courses"></svg>
    <div class="legend">
      <div><span class="lg" style="background:#2f7d9a"></span>Links</div>
      <div><span class="lg" style="background:#3f8f4f"></span>Parkland</div>
      <div><span class="lg" style="background:#a0742f"></span>Heathland</div>
      <div><span class="lg" style="background:#7b6aa8"></span>Upland</div>
      <div><span class="lg" style="background:#c9932e;border:2px solid #fff;box-shadow:0 0 0 1px #c9932e"></span>Your starting town</div>
    </div>
    <div class="maplabel">Republic of Ireland</div>
    <div class="tip" id="tip"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="outline.js"></script>
<script src="finder.js"></script>
</body>
</html>
